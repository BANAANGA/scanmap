services:
  scanmap:
    build: .
    image: ghcr.io/banaanga/scanmap:latest
    container_name: scanmap
    restart: unless-stopped
    ports:
      - "8420:8420"
    # SYN scans and zmap send raw packets; the container needs these
    # capabilities instead of full root.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      SCANMAP_PORT: "8420"
      SCANMAP_MAX_PARALLEL: "2"
      # Set both to require HTTP basic auth (put a TLS proxy in front!).
      SCANMAP_USER: ""
      SCANMAP_PASSWORD: ""
    volumes:
      # Blocklists and other input files live here and are mounted read-only
      # into the app.
      - ./data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8420/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
